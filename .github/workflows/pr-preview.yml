name: Preview to BFFless

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # Allow the action to comment the preview URL on the PR

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate proxy rules
        run: npm run rules:validate

      - name: Test proxy-rule handlers
        run: npm run rules:test

      # A read-only check: report what merging this PR would change about the
      # live rule sets, as a PR comment. Nothing is written — production's rules
      # only ever change from `main` (see deploy.yml).
      - name: Preview proxy-rule changes
        uses: bffless/deploy-proxy-rules@v1
        with:
          path: |
            .bffless/proxy-rules/api-backend
            .bffless/proxy-rules/chat_pipelines
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          project: bffless/example-project
          prune: true
          dry-run: true
          pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Compare coverage against production
        uses: bffless/compare-coverage@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: ./coverage/lcov.info
          baseline-alias: production
          baseline-path: coverage/lcov.info
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          fail-on-regression: false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e and capture screenshots
        run: npm run test:e2e

      - name: Compare screenshots against production
        uses: bffless/compare-screenshots@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: ./screenshots
          baseline-alias: production
          baseline-path: screenshots
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          fail-on-difference: false

      - name: Deploy preview to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: preview
          description: 'Preview from PR #${{ github.event.pull_request.number }}'
          # Attachment is additive and idempotent: naming both sets keeps /api/chat
          # working on the preview alias too. The preview runs against the rule sets
          # currently live — this PR's rule changes only land when it merges.
          proxy-rule-set-names: api-backend,chat_pipelines
          pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage report to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: coverage
          base-path: /
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: preview
          description: 'Coverage report from PR #${{ github.event.pull_request.number }}'

      - name: Upload Playwright screenshots to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: screenshots
          base-path: /
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: preview
          description: 'Playwright screenshots from PR #${{ github.event.pull_request.number }}'

      - name: Upload Playwright report to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: playwright-report
          base-path: /
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: preview
          description: 'Playwright HTML report from PR #${{ github.event.pull_request.number }}'

      # Skills only — see the note in deploy.yml.
      - name: Upload chat skills to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: .bffless/skills
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: preview
          description: 'Chat skills from PR #${{ github.event.pull_request.number }}'