name: Preview to BFFless

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # Allow the action to comment the preview URL on the PR

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e and capture screenshots
        run: npm run test:e2e

      - name: Deploy preview to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: pr-${{ github.event.pull_request.number }}
          description: 'Preview for PR #${{ github.event.pull_request.number }}'
          proxy-rule-set-name: api-backend
          pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage report to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: coverage
          base-path: /
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: pr-${{ github.event.pull_request.number }}
          description: 'Coverage report for PR #${{ github.event.pull_request.number }}'

      - name: Upload Playwright screenshots to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: screenshots
          base-path: /
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: pr-${{ github.event.pull_request.number }}
          description: 'Playwright screenshots for PR #${{ github.event.pull_request.number }}'

      - name: Upload Playwright report to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: playwright-report
          base-path: /
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: pr-${{ github.event.pull_request.number }}
          description: 'Playwright HTML report for PR #${{ github.event.pull_request.number }}'