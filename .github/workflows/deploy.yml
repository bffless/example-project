name: Deploy to BFFless

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

concurrency:
  group: deploy
  cancel-in-progress: false  # Ensure deployments run in order

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The API this site calls is code in this repo (.bffless/proxy-rules).
      # Lint the manifests and run the handler fixtures before anything ships.
      - name: Validate proxy rules
        run: npm run rules:validate

      - name: Test proxy-rule handlers
        run: npm run rules:test

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e and capture screenshots
        run: npm run test:e2e

      # Sync the rule sets BEFORE the bundle that calls them, so a new route is
      # never missing for the deploy that needs it. `prune: true` deletes rules
      # the server has but git doesn't — git is the source of truth.
      - name: Sync proxy rules to BFFless
        id: rules
        uses: bffless/deploy-proxy-rules@v1
        with:
          path: |
            .bffless/proxy-rules/api-backend
            .bffless/proxy-rules/chat_pipelines
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          project: bffless/example-project
          prune: true

      - name: Deploy to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: production
          proxy-rule-set-names: ${{ steps.rules.outputs.rule-set-names }}

      - name: Upload coverage report to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: coverage
          base-path: /
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: production
          description: 'Coverage report for production'

      - name: Upload Playwright screenshots to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: screenshots
          base-path: /
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: production
          description: 'Playwright screenshots for production'

      - name: Upload Playwright report to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: playwright-report
          base-path: /
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: production
          description: 'Playwright HTML report for production'

      # Only the skills — .bffless also holds the proxy-rule sources now, and
      # those belong in the rule set, not in the deployed bundle. The served
      # prefix is derived from `path`, so files still land at
      # .bffless/skills/<name>/SKILL.md, exactly where chat looks for them.
      - name: Upload chat skills to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: .bffless/skills
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: production
          description: 'Chat skills for production'