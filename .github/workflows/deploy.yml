name: Deploy to BFFless

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

concurrency:
  group: deploy
  cancel-in-progress: false  # Ensure deployments run in order

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e and capture screenshots
        run: npm run test:e2e

      - name: Deploy to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: production

      - name: Upload coverage report to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: coverage
          base-path: ./
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: production
          description: 'Coverage report for production'

      - name: Upload Playwright screenshots to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: screenshots
          base-path: ./
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: production
          description: 'Playwright screenshots for production'